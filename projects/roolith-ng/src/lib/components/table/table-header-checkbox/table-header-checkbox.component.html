<div
  class="rng-input"
  [class.rng-input--disabled]="disabled()">
  <label class="rng-input-checkbox rng-input-checkbox--standalone">
    <input
      type="checkbox"
      class="rng-input-checkbox__field"
      [class.is--indeterminate]="indeterminate()"
      [checked]="fieldValue()"
      (change)="onChange($event)" />
  </label>
</div>
