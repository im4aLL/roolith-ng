<!-- calendar -->
<div class="rng-calendar">
  <!-- header -->
  <div class="rng-calendar__header">
    <div class="rng-calendar__nav">
      <button class="rng-button rng-button--ghost rng-button--xsmall">
        <i class="rng-icon rng-icon--arrow-left"></i>
      </button>
    </div>

    <div class="rng-calendar__title">
      <div class="rng-calendar__select">
        <select class="rng-calendar__select-input">
          <option value="">Jan</option>
          <option value="">Feb</option>
          <option value="">Mar</option>
          <option value="">Apr</option>
          <option value="">May</option>
          <option value="">Jun</option>
          <option value="">Jul</option>
          <option value="">Aug</option>
          <option value="">Sep</option>
          <option value="">Oct</option>
          <option value="">Nov</option>
          <option value="">Dec</option>
        </select>
        <div class="rng-calendar__select-icon"><i class="rng-icon rng-icon--small rng-icon--chevron-down"></i></div>
      </div>

      <div class="rng-calendar__select">
        <select class="rng-calendar__select-input">
          <option value="">2026</option>
          <option value="">2025</option>
          <option value="">2024</option>
          <option value="">2023</option>
          <option value="">2022</option>
        </select>
        <div class="rng-calendar__select-icon"><i class="rng-icon rng-icon--small rng-icon--chevron-down"></i></div>
      </div>
    </div>

    <div class="rng-calendar__nav">
      <button class="rng-button rng-button--ghost rng-button--xsmall">
        <i class="rng-icon rng-icon--arrow-right"></i>
      </button>
    </div>
  </div>
  <!-- header -->

  <!-- body -->
  <div class="rng-calendar__body">
    <div class="rng-calendar__day rng-calendar__day--header">Su</div>
    <div class="rng-calendar__day rng-calendar__day--header">Mo</div>
    <div class="rng-calendar__day rng-calendar__day--header">Tu</div>
    <div class="rng-calendar__day rng-calendar__day--header">We</div>
    <div class="rng-calendar__day rng-calendar__day--header">Th</div>
    <div class="rng-calendar__day rng-calendar__day--header">Fr</div>
    <div class="rng-calendar__day rng-calendar__day--header">Sa</div>

    <div class="rng-calendar__day rng-calendar__day--dimmed">29</div>
    <div class="rng-calendar__day rng-calendar__day--dimmed">30</div>
    <div class="rng-calendar__day rng-calendar__day--dimmed">31</div>
    <div class="rng-calendar__day">1</div>
    <div class="rng-calendar__day">2</div>
    <div class="rng-calendar__day">3</div>
    <div class="rng-calendar__day">4</div>

    <div class="rng-calendar__day">5</div>
    <div class="rng-calendar__day">6</div>
    <div class="rng-calendar__day">7</div>
    <div class="rng-calendar__day">8</div>
    <div class="rng-calendar__day rng-calendar__day--active">9</div>
    <div class="rng-calendar__day">10</div>
    <div class="rng-calendar__day">11</div>

    <div class="rng-calendar__day">12</div>
    <div class="rng-calendar__day">13</div>
    <div class="rng-calendar__day">14</div>
    <div class="rng-calendar__day">15</div>
    <div class="rng-calendar__day">16</div>

    <div class="rng-calendar__day rng-calendar__day--dimmed">2</div>
  </div>
  <!-- body -->
</div>
<!-- calendar -->
