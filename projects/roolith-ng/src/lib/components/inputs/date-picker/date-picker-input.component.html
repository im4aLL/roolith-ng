<div
  class="rng-input rng-input--date-picker"
  [class.rng-input--disabled]="disabled()"
  [class.rng-input--error]="error() || errors().length > 0">
  @if (label()) {
    <label
      [for]="id()"
      class="rng-input__label">
      {{ label() }}
    </label>
  }
  <button
    [id]="id()"
    class="rng-input__field-wrapper"
    [attr.popovertarget]="'rng-calendar-el' + id()"
    [style]="'anchor-name: --rng-calendar-popover-' + id()">
    <span
      class="rng-input__field"
      [class.rng-input__field--placeholder]="isShowPlaceholder()">
      {{ dateFieldLabel() || placeholder() }}
    </span>
    <i class="rng-icon rng-icon--calendar rng-input__icon"></i>
  </button>

  <div
    #popoverEl
    [id]="'rng-calendar-el' + id()"
    class="rng-calendar-popover rng-animation rng-reveal"
    popover
    [style]="'--rng-calendar-popover-anchor: --rng-calendar-popover-' + id()">
    <rng-calendar
      [value]="value()"
      (valueChange)="onCalendarValueChange($event)" />
  </div>

  @if (hintMessage()) {
    <span class="rng-input__hint">{{ hintMessage() }}</span>
  }
</div>
