<div class="rng-input">
  <label
    for="input6"
    class="rng-input__label">
    Multi select
  </label>
  <!-- rng-input__field--focused is--active -->
  <div class="rng-input__field-container is--active">
    <div
      class="rng-input__field rng-input__field--focused rng-input__field--select rng-input__field--select-multiple has--item">
      <div class="rng-input-chip">
        United States
        <button class="rng-input-chip__close">
          <i class="rng-icon rng-icon--close"></i>
        </button>
      </div>
      <div class="rng-input-chip">
        United Kingdom
        <button class="rng-input-chip__close">
          <i class="rng-icon rng-icon--close"></i>
        </button>
      </div>
      <div class="rng-input-chip">
        Australia
        <button class="rng-input-chip__close">
          <i class="rng-icon rng-icon--close"></i>
        </button>
      </div>
      <div class="rng-input-chip rng-input-chip__text">5 more selected</div>

      <input
        type="text"
        id="input6"
        name="input6"
        class="rng-input__plain" />
    </div>

    <ul class="rng-input-list">
      <li class="rng-input-list__item">
        United States
        <i class="rng-icon rng-icon--check rng-input-list__icon"></i>
      </li>
      <li class="rng-input-list__item">United Kingdom</li>
      <li class="rng-input-list__item">Canada</li>
      <li class="rng-input-list__item">Australia</li>
      <li class="rng-input-list__item">Germany</li>
      <li class="rng-input-list__item">France</li>
      <li class="rng-input-list__item">India</li>
      <li class="rng-input-list__item">China</li>
      <li class="rng-input-list__item">Japan</li>
    </ul>
  </div>
</div>
