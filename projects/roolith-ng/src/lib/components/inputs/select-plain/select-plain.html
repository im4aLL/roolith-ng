<div class="rng-input rng-input--select">
  <label
    for="input-plain-select"
    class="rng-input__label">
    Select an option
  </label>
  <div class="rng-input__field-wrapper">
    <select
      name="input-plain-select"
      id="input-plain-select"
      class="rng-input__field">
      <option value=""></option>
      <option value="">Option 1</option>
      <option value="">Option 2</option>
      <option value="">Option 3</option>
    </select>

    <i class="rng-icon rng-icon--select rng-input__icon"></i>
  </div>

  <span class="rng-input__hint">You can select any item of your choice</span>
</div>
