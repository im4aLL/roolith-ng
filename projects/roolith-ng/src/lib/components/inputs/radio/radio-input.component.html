<div
  class="rng-input rng-input--radio"
  [class.rng-input--error]="error()"
  [class.rng-input--disabled]="disabled()">
  @if (label()) {
    <label
      class="rng-input__label"
      [for]="id() + '-0'">
      {{ label() }}
    </label>
  }

  <div
    class="rng-input__field-wrapper"
    [class.rng-input__field-wrapper--alt]="!inline()">
    @for (option of options(); track option.value; let i = $index) {
      <label [for]="id() + '-' + i">
        <input
          type="radio"
          [id]="id() + '-' + i"
          [name]="name() || id()"
          class="rng-input__radio"
          [value]="option.value"
          [checked]="value() === option.value"
          [disabled]="disabled()"
          [attr.aria-invalid]="invalid()"
          [attr.aria-required]="required()"
          (change)="onChange($event)"
          (blur)="touched.set(true)" />
        {{ option.label }}
      </label>
    }
  </div>

  @if (hintMessage()) {
    <span class="rng-input__hint">{{ hintMessage() }}</span>
  }
</div>
