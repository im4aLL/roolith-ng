<div class="rng-card">
  <div class="rng-card__header">
    <div class="rng-card__header-text">
      <h6 class="rng-card__hl">Card title</h6>
      <div class="rng-card__subhl">Card subtitle</div>
    </div>
    <div class="rng-card__action">
      <rng-button
        size="xsmall"
        variant="link">
        Open Action
      </rng-button>
    </div>
  </div>
  <div class="rng-card__body">
    Lorem ipsum dolor sit amet, consectetur adipisicing elit. Voluptas, eaque. This is the body of the card component.
  </div>
  <div class="rng-card__footer">
    <rng-button
      variant="dark"
      [block]="true">
      Action 1
    </rng-button>
    <rng-button [block]="true">Action 2</rng-button>
  </div>
</div>
