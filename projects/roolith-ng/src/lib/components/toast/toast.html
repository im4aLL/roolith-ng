<div class="rng-toast">
  <div class="rng-toast__item">
    <i class="rng-icon rng-icon--check rng-toast__icon"></i>
    <div class="rng-toast__content">
      <div class="rng-toast__content-hl">Success!</div>
      Your changes have been saved successfully.
    </div>
    <div class="rng-toast__close">
      <button class="rng-button rng-button--dark rng-button--xsmall">Clear</button>
    </div>
  </div>
  <div class="rng-toast__item">
    <i class="rng-icon rng-icon--alert rng-toast__icon"></i>
    <div class="rng-toast__content">
      <div class="rng-toast__content-hl">Error!</div>
      Oops, something went wrong. Please try again later.
    </div>
    <div class="rng-toast__close">
      <button class="rng-button rng-button--dark rng-button--xsmall">Clear</button>
    </div>
  </div>
  <div class="rng-toast__item">
    <i class="rng-icon rng-icon--info rng-toast__icon"></i>
    <div class="rng-toast__content">
      <div class="rng-toast__content-hl">Info</div>
      This is an informational message for your awareness.
    </div>
    <div class="rng-toast__close">
      <button class="rng-button rng-button--dark rng-button--xsmall">Clear</button>
    </div>
  </div>
  <div class="rng-toast__item">
    <i class="rng-icon rng-icon--alert rng-toast__icon"></i>
    <div class="rng-toast__content">
      <div class="rng-toast__content-hl">Warning!</div>
      Please be cautious when performing this action.
    </div>
    <div class="rng-toast__close">
      <button class="rng-button rng-button--dark rng-button--xsmall">Clear</button>
    </div>
  </div>
</div>
