<header class="doc-topbar">
  <a class="doc-topbar__brand" routerLink="/">
    <div class="doc-topbar__logo is--light">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="25" stroke="#2E3239" stroke-width="7"></circle>
        <circle cx="32" cy="32" r="10" fill="#28A382"></circle>
      </svg>
    </div>

    <div class="doc-topbar__logo is--dark">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="25" stroke="#3c3f44" stroke-width="7"></circle>
        <circle cx="32" cy="32" r="10" fill="#28A382"></circle>
      </svg>
    </div>
    <span>Roolith NG</span>
    <span class="doc-topbar__version">v{{ version }}</span>
  </a>

  @if (!isHome()) {
    <button
      type="button"
      class="doc-topbar__menu"
      (click)="menuToggle.emit()"
      aria-label="Toggle navigation menu"
    >
      <i class="iconoir-menu" aria-hidden="true"></i>
    </button>
  }

  <nav class="doc-topbar__nav">
    @for (link of links; track link.route) {
      <a
        class="doc-topbar__link"
        [routerLink]="link.route"
        routerLinkActive="doc-topbar__link--active"
        [routerLinkActiveOptions]="{ exact: false }"
        >{{ link.label }}</a
      >
    }
  </nav>

  <span class="doc-topbar__spacer"></span>

  <a
    class="doc-topbar__github"
    href="https://github.com/im4aLL/roolith-ng"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="GitHub repository"
  >
    <svg
      class="doc-icon doc-icon--github"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 16 16"
      width="20"
      height="20"
      fill="currentColor"
      aria-hidden="true"
    >
      <path
        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
      />
    </svg>
  </a>

  <button
    type="button"
    class="doc-theme-toggle"
    role="switch"
    [class.doc-theme-toggle--dark]="theme() === 'dark'"
    [attr.aria-checked]="theme() === 'dark'"
    [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
    (click)="themeToggle.emit()"
  >
    <span class="doc-theme-toggle__check">
      <span class="doc-theme-toggle__icon">
        <i class="iconoir-sun-light doc-theme-toggle__sun" aria-hidden="true"></i>
        <i class="iconoir-half-moon doc-theme-toggle__moon" aria-hidden="true"></i>
      </span>
    </span>
  </button>
</header>
