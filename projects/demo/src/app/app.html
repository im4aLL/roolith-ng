<rng-doc-topbar
  [theme]="theme()"
  [isHome]="!!isHome()"
  (themeToggle)="toggleTheme()"
  (menuToggle)="toggleMenu()"
/>
<div class="doc-body">
  @if (!isHome()) {
    <rng-doc-sidebar class="doc-sidebar--desktop" />
  }
  <main class="doc-content">
    <div class="doc-layout">
      <div class="doc-container" [class.doc-container--home]="isHome()">
        <router-outlet />
      </div>
      @if (!isHome()) {
        <rng-doc-page-outline />
      }
    </div>
  </main>
</div>
@if (!isHome()) {
  <div
    class="doc-drawer-backdrop"
    [class.doc-drawer-backdrop--open]="menuOpen()"
    (click)="closeMenu()"
    aria-hidden="true"
  ></div>
  <aside
    class="doc-drawer"
    [class.doc-drawer--open]="menuOpen()"
    [attr.aria-hidden]="!menuOpen()"
    role="dialog"
    aria-modal="true"
    aria-label="Navigation"
  >
    <div class="doc-drawer__header">
      <p class="doc-drawer__title">Navigation</p>
      <button
        type="button"
        class="doc-drawer__close"
        (click)="closeMenu()"
        aria-label="Close navigation"
      >
        <i class="iconoir-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <div class="doc-drawer__content">
      <rng-doc-sidebar class="doc-drawer__sidebar" />
    </div>
  </aside>
}
@if (isHome()) {
  <footer class="doc-footer">
    <div class="doc-footer__inner">
      <div class="doc-footer__main">
        <a class="doc-footer__brand" routerLink="/">
          <span class="doc-footer__logo is--light" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
              <circle cx="32" cy="32" r="25" stroke="#2E3239" stroke-width="7"></circle>
              <circle cx="32" cy="32" r="10" fill="#28A382"></circle>
            </svg>
          </span>
          <span class="doc-footer__logo is--dark" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
              <circle cx="32" cy="32" r="25" stroke="#3c3f44" stroke-width="7"></circle>
              <circle cx="32" cy="32" r="10" fill="#28A382"></circle>
            </svg>
          </span>
          <span>Roolith NG</span>
          <span class="doc-footer__tagline">Enterprise UI without the boilerplate</span>
        </a>
        <nav class="doc-footer__nav" aria-label="Footer navigation">
          <a class="doc-footer__link" routerLink="/guide/getting-started">Getting Started</a>
          <a class="doc-footer__link" routerLink="/guide/theming">Theming</a>
          <a class="doc-footer__link" routerLink="/guide/ai-ready">AI Ready</a>
          <a class="doc-footer__link" routerLink="/guide/components">Components</a>
          <a
            class="doc-footer__link"
            href="https://github.com/im4aLL/roolith-ng"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg
              class="doc-icon doc-icon--github"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              width="16"
              height="16"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
              />
            </svg>
            GitHub
          </a>
        </nav>
      </div>
      <div class="doc-footer__bottom">
        <div class="doc-footer__copy-row">
          <p class="doc-footer__copy">Released under the MIT License.</p>
          <span class="doc-footer__sep" aria-hidden="true"></span>
          <p class="doc-footer__copy">Copyright &copy; 2026 Roolith NG</p>
        </div>
        <span class="doc-footer__meta"
          ><i class="iconoir-spark" aria-hidden="true"></i> Crafted for Angular developers</span
        >
      </div>
    </div>
  </footer>
}
